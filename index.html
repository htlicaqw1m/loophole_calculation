<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loophole Offset Calculator</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #16191e;
    --edge: #262b33;
    --text: #e8eaed;
    --dim: #8b93a1;
    --accent: #ff453a;
    --good: #30d158;
    --focus: #0a84ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 14px 40px;
  }
  main { width: 100%; max-width: 860px; }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: -.01em; margin-bottom: 2px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }

  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 16px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 5px;
  }
  .field .unit { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--edge);
    border-radius: 10px;
    color: var(--text);
    font: 600 20px/1 ui-monospace, "SF Mono", Consolas, monospace;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--focus); }
  .field input:invalid { border-color: var(--accent); }

  #result {
    border-radius: 14px;
    border: 1px solid var(--edge);
    background: var(--panel);
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  #result .big {
    font: 700 34px/1.1 ui-monospace, "SF Mono", Consolas, monospace;
    letter-spacing: -.01em;
  }
  #result .big .dir { font-size: 18px; font-weight: 650; letter-spacing: .04em; }
  #result .below { color: var(--accent); }
  #result .above { color: var(--good); }
  #result .hint { color: var(--dim); font-size: 13px; margin-top: 6px; }
  #result .hint b { color: var(--text); }

  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
  .stat {
    background: var(--bg);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .stat .k { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .stat .v { font: 600 15px/1.4 ui-monospace, "SF Mono", Consolas, monospace; }

  #scopewrap { display: flex; justify-content: center; }
  svg { display: block; touch-action: none; }
  .note { color: var(--dim); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>Loophole Offset</h1>
  <div class="sub">Where the bullet crosses the loophole plane, in mils from your reticle center.</div>

  <div id="result">
    <div class="big" id="bignum">—</div>
    <div class="hint" id="hint"></div>
    <div class="stats">
      <div class="stat"><div class="k">Zero angle</div><div class="v" id="s-zero">—</div></div>
      <div class="stat"><div class="k">Bore vs sight</div><div class="v" id="s-total">—</div></div>
      <div class="stat"><div class="k">Linear offset</div><div class="v" id="s-lin">—</div></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="field">
        <label for="hob">Height over bore <span class="unit">(in)</span></label>
        <input id="hob" type="number" inputmode="decimal" step="0.05" min="0.1" value="2.5" required>
      </div>
      <div class="field">
        <label for="mv">Muzzle velocity <span class="unit">(fps)</span></label>
        <input id="mv" type="number" inputmode="decimal" step="10" min="300" value="2750" required>
      </div>
      <div class="field">
        <label for="zero">Zero distance <span class="unit">(yd)</span></label>
        <input id="zero" type="number" inputmode="decimal" step="5" min="10" value="100" required>
      </div>
      <div class="field">
        <label for="sol">Target solution <span class="unit">(mils up)</span></label>
        <input id="sol" type="number" inputmode="decimal" step="0.1" value="0" required>
      </div>
      <div class="field">
        <label for="dist">Loophole distance <span class="unit">(ft)</span></label>
        <input id="dist" type="number" inputmode="decimal" step="0.5" min="1" value="10" required>
      </div>
      <div class="note">
        Assumes a straight bullet path from muzzle to loophole (close range), flat-fire
        vacuum drop for the zero angle, and the solution dialed or held as listed.
      </div>
    </div>

    <div class="panel" id="scopewrap">
      <svg id="scope" width="420" height="460" viewBox="0 0 420 460" role="img"
           aria-label="Reticle view showing bullet position at the loophole"></svg>
    </div>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const G = 32.174;               // ft/s^2
const SVGNS = "http://www.w3.org/2000/svg";
const IDS = ["hob", "mv", "zero", "sol", "dist"];

function readInputs() {
  const v = {};
  for (const id of IDS) {
    const n = parseFloat($(id).value);
    if (!isFinite(n)) return null;
    v[id] = n;
  }
  if (v.hob <= 0 || v.mv <= 0 || v.zero <= 0 || v.dist <= 0) return null;
  return v;
}

function compute(v) {
  const hobFt = v.hob / 12;
  const zFt = v.zero * 3;
  const dFt = v.dist;
  const dropFt = 0.5 * G * Math.pow(zFt / v.mv, 2);
  const thetaZero = (hobFt + dropFt) / zFt;          // rad, bore above sight when zeroed
  const thetaTotal = thetaZero + v.sol / 1000;       // rad, after dialing/holding solution
  const offsetMils = (thetaTotal - hobFt / dFt) * 1000;  // angular, as seen in scope
  const linearIn = (thetaTotal * dFt - hobFt) * 12;      // inches vs line of sight
  return { zeroMils: thetaZero * 1000, totalMils: thetaTotal * 1000, offsetMils, linearIn };
}

function fmt(n, digits) { return n.toFixed(digits === undefined ? 2 : digits); }

function render() {
  const v = readInputs();
  if (!v) {
    $("bignum").textContent = "—";
    $("hint").textContent = "Enter valid positive values above.";
    for (const id of ["s-zero", "s-total", "s-lin"]) $(id).textContent = "—";
    drawScope(null);
    return;
  }
  const r = compute(v);
  const below = r.offsetMils < 0;
  const mag = Math.abs(r.offsetMils);

  const big = $("bignum");
  big.className = "big " + (below ? "below" : "above");
  big.innerHTML = fmt(mag, 2) + " mils <span class='dir'>" + (below ? "BELOW" : "ABOVE") + "</span>";

  $("hint").innerHTML = below
    ? "Keep your point of aim at least <b>" + fmt(mag, 1) + " mils</b> above the bottom edge of the loophole."
    : "Keep your point of aim at least <b>" + fmt(mag, 1) + " mils</b> below the top edge of the loophole.";

  $("s-zero").textContent = fmt(r.zeroMils) + " mil";
  $("s-total").textContent = fmt(r.totalMils) + " mil";
  $("s-lin").textContent = fmt(r.linearIn, 1) + " in " + (r.linearIn < 0 ? "low" : "high");

  drawScope(r.offsetMils);
  try { localStorage.setItem("loophole_v1", JSON.stringify(v)); } catch (e) {}
}

function el(name, attrs, text) {
  const n = document.createElementNS(SVGNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}

function drawScope(offsetMils) {
  const svg = $("scope");
  svg.textContent = "";
  const W = 420, H = 460, cx = W / 2, cy = H / 2;
  const R = Math.min(cx, cy) - 8;

  // adaptive vertical scale so the dot always fits
  const span = Math.max(4, Math.ceil(Math.abs(offsetMils || 0)) + 2); // mils shown above/below center
  const pxPerMil = (R - 26) / span;

  // scope body
  svg.appendChild(el("circle", { cx, cy, r: R, fill: "#07080a", stroke: "#31363f", "stroke-width": 3 }));
  const clip = el("clipPath", { id: "lens" });
  clip.appendChild(el("circle", { cx, cy, r: R - 3 }));
  const defs = el("defs", {});
  defs.appendChild(clip);
  svg.appendChild(defs);
  const g = el("g", { "clip-path": "url(#lens)" });
  svg.appendChild(g);

  // crosshair
  g.appendChild(el("line", { x1: cx - R, y1: cy, x2: cx + R, y2: cy, stroke: "#cfd3da", "stroke-width": 1.4 }));
  g.appendChild(el("line", { x1: cx, y1: cy - R, x2: cx, y2: cy + R, stroke: "#cfd3da", "stroke-width": 1.4 }));

  // mil hashes; label every mil if roomy, else every 2 or 5
  const labelStep = pxPerMil > 34 ? 1 : (pxPerMil > 15 ? 2 : 5);
  for (let m = 1; m <= span + 1; m++) {
    const long = m % 5 === 0;
    const len = long ? 14 : 8;
    for (const s of [-1, 1]) {
      const y = cy + s * m * pxPerMil;
      g.appendChild(el("line", { x1: cx - len, y1: y, x2: cx + len, y2: y, stroke: "#cfd3da", "stroke-width": long ? 1.6 : 1.1 }));
      if (m % labelStep === 0) {
        g.appendChild(el("text", {
          x: cx + len + 5, y: y + 4, fill: "#69707c",
          "font-size": "11", "font-family": "ui-monospace, Consolas, monospace"
        }, String(m)));
      }
      const x = cx + s * m * pxPerMil;
      if (Math.abs(x - cx) < R - 10) {
        g.appendChild(el("line", { x1: x, y1: cy - len, x2: x, y2: cy + len, stroke: "#cfd3da", "stroke-width": long ? 1.6 : 1.1 }));
      }
    }
  }

  if (offsetMils === null || !isFinite(offsetMils)) return;

  // bullet position: positive offset = above reticle center (screen up = -y)
  const by = cy - offsetMils * pxPerMil;
  g.appendChild(el("circle", { cx, cy: by, r: 10, fill: "rgba(255,69,58,.18)" }));
  g.appendChild(el("circle", { cx, cy: by, r: 5, fill: "#ff453a" }));
  g.appendChild(el("text", {
    x: cx - 14, y: by + 4, fill: "#ff453a", "text-anchor": "end",
    "font-size": "12", "font-weight": "700",
    "font-family": "ui-monospace, Consolas, monospace"
  }, fmt(Math.abs(offsetMils), 1)));
}

for (const id of IDS) $(id).addEventListener("input", render);
try {
  const saved = JSON.parse(localStorage.getItem("loophole_v1"));
  if (saved) for (const id of IDS) if (isFinite(saved[id])) $(id).value = saved[id];
} catch (e) {}
render();
</script>
</body>
</html>
